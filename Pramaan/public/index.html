<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#A8D91C">
  <meta name="description" content="Pramaan is a consent-first identity verification prototype.">
  <title>Pramaan — Prove one fact. Share nothing else.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    /* ------------------------------------------------------------------
       Design tokens and global styles
       ------------------------------------------------------------------ */
    :root {
      color-scheme: light;
      --page: #f4f7fc;
      --surface: #ffffff;
      --surface-soft: #f7f9fd;
      --ink: #14213d;
      --muted: #697792;
      --line: #e3e9f3;
      --brand: #315ee8;
      --brand-dark: #2348c6;
      --brand-soft: #edf2ff;
      --teal: #16a6a0;
      --green: #168653;
      --red: #c83e4d;
      --amber: #9a6a10;
      --amber-bg: #fff6df;
      --shadow: 0 18px 50px rgba(30, 50, 90, .08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font: 15px/1.6 "DM Sans", system-ui, sans-serif;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    a:focus-visible,
    summary:focus-visible {
      outline: 3px solid rgba(49, 94, 232, .35);
      outline-offset: 3px;
    }

    a {
      color: var(--brand);
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: Manrope, "DM Sans", sans-serif;
      line-height: 1.2;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 6vw, 4.5rem);
      letter-spacing: -.055em;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1.45rem;
      letter-spacing: -.025em;
    }

    h3 {
      margin: 0 0 8px;
      font-size: 1.08rem;
    }

    p {
      margin: 8px 0 14px;
    }

    .muted,
    small {
      color: var(--muted);
    }

    .muted {
      max-width: 70ch;
    }

    .eyebrow {
      color: var(--brand);
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .hidden {
      display: none !important;
    }

    /* ------------------------------------------------------------------
       Header, navigation and page layout
       ------------------------------------------------------------------ */
    .demo-strip {
      padding: 8px 16px;
      background: #101b35;
      color: #dce6ff;
      text-align: center;
      font-size: .78rem;
      letter-spacing: .01em;
    }

    .demo-strip strong {
      color: #fff;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 13px max(22px, calc((100vw - 1180px) / 2));
      background: rgba(255, 255, 255, .92);
      border-bottom: 1px solid rgba(227, 233, 243, .9);
      backdrop-filter: blur(16px);
    }

    .brand-lockup {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      background: none;
      color: var(--ink);
      padding: 0;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 12px;
      color: white;
      font: 800 1.05rem Manrope, sans-serif;
      background: linear-gradient(145deg, #4776ff, #1e45c6);
      box-shadow: 0 7px 18px rgba(49, 94, 232, .24);
    }

    .brand-name {
      font: 800 1.15rem Manrope, sans-serif;
      letter-spacing: -.04em;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .nav-button,
    .quiet-button {
      border: 0;
      border-radius: 10px;
      padding: 9px 11px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: .86rem;
    }

    .nav-button:hover,
    .quiet-button:hover {
      background: var(--surface-soft);
      color: var(--ink);
    }

    .nav-button.active {
      background: var(--brand-soft);
      color: var(--brand);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .icon-button {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      color: var(--ink);
      padding: 8px 10px;
    }

    .notification-count {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 17px;
      height: 17px;
      border-radius: 20px;
      background: var(--red);
      color: white;
      font-size: .68rem;
      display: grid;
      place-items: center;
      padding: 0 4px;
    }

    main {
      width: min(1120px, calc(100% - 36px));
      min-height: 65vh;
      margin: 0 auto;
      padding: 34px 0 64px;
    }

    .page-heading {
      margin-bottom: 22px;
    }

    .page-heading p {
      margin: 7px 0 0;
      color: var(--muted);
    }

    .footer {
      padding: 24px 18px 36px;
      color: var(--muted);
      text-align: center;
      font-size: .82rem;
    }

    /* ------------------------------------------------------------------
       Reusable cards, buttons, forms and status labels
       ------------------------------------------------------------------ */
    .card {
      padding: 22px;
      margin: 0 0 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 5px 22px rgba(30, 50, 90, .035);
    }

    .card.soft {
      background: var(--surface-soft);
      box-shadow: none;
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }

    .card-head p {
      margin: 4px 0 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 10px 16px;
      margin: 3px 5px 3px 0;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      color: var(--ink);
      font-weight: 700;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 7px 18px rgba(30, 50, 90, .08);
    }

    .button.primary {
      background: var(--brand);
      color: white;
      border-color: var(--brand);
    }

    .button.primary:hover {
      background: var(--brand-dark);
    }

    .button.danger {
      color: var(--red);
      border-color: #f0cbd0;
      background: #fffafb;
    }

    .button.small {
      min-height: 34px;
      padding: 6px 10px;
      font-size: .82rem;
    }

    .button.large {
      min-height: 50px;
      padding: 13px 20px;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: .55;
      transform: none;
    }

    .field {
      display: block;
      margin: 13px 0;
      color: var(--ink);
      font-size: .88rem;
      font-weight: 700;
    }

    .field input,
    .field select,
    .field textarea {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 12px 13px;
      border: 1px solid #d8e0ed;
      border-radius: 11px;
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: border .15s, box-shadow .15s;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(49, 94, 232, .1);
    }

    .choice {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 0;
      font-weight: 500;
    }

    .choice input {
      width: 17px;
      height: 17px;
      margin-top: 3px;
      accent-color: var(--brand);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border-radius: 99px;
      background: #edf2ff;
      color: #3156c6;
      font-size: .74rem;
      font-weight: 800;
    }

    .pill.green {
      background: #e8f7ef;
      color: var(--green);
    }

    .pill.red {
      background: #fff0f1;
      color: var(--red);
    }

    .pill.gray {
      background: #eef1f5;
      color: #667085;
    }

    .pill.amber {
      background: var(--amber-bg);
      color: var(--amber);
    }

    .notice {
      padding: 13px 15px;
      margin: 12px 0;
      border: 1px solid #f0dfb5;
      border-radius: 12px;
      background: var(--amber-bg);
      color: #75520e;
      font-size: .88rem;
    }

    .notice.blue {
      border-color: #dce5ff;
      background: #f1f5ff;
      color: #294caa;
    }

    .notice.green {
      border-color: #ccebd9;
      background: #effaf3;
      color: #176b43;
    }

    .empty-state {
      padding: 28px 16px;
      text-align: center;
      color: var(--muted);
    }

    .empty-icon {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      margin: 0 auto 10px;
      border-radius: 15px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 1.4rem;
    }

    .divider {
      height: 1px;
      margin: 17px 0;
      background: var(--line);
    }

    .inline-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .row-title {
      flex: 1 1 190px;
      font-weight: 700;
    }

    .mono {
      font: 700 1.1rem ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .08em;
    }

    /* ------------------------------------------------------------------
       Landing page
       ------------------------------------------------------------------ */
    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 6vw, 68px);
      border-radius: 28px;
      color: white;
      background: radial-gradient(circle at 84% 12%, rgba(89, 140, 255, .48), transparent 30%),
        linear-gradient(125deg, #101b35 0%, #1a3470 58%, #315ee8 100%);
      box-shadow: 0 25px 65px rgba(30, 58, 130, .2);
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -85px;
      bottom: -180px;
      width: 390px;
      height: 390px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 50%;
      box-shadow: 0 0 0 35px rgba(255, 255, 255, .035), 0 0 0 75px rgba(255, 255, 255, .025);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 680px;
    }

    .hero .eyebrow {
      color: #a9c1ff;
    }

    .hero h1 {
      margin: 14px 0 18px;
    }

    .hero p {
      max-width: 590px;
      color: #d7e2ff;
      font-size: 1.08rem;
    }

    .hero .button:not(.primary) {
      color: white;
      border-color: rgba(255, 255, 255, .35);
      background: rgba(255, 255, 255, .09);
    }

    .hero .button.primary {
      background: white;
      color: #1d43b6;
      border-color: white;
    }

    .hero-note {
      margin-top: 22px;
      color: #c5d4ff;
      font-size: .8rem;
    }

    .section {
      margin-top: 54px;
    }

    .section-intro {
      max-width: 670px;
      margin-bottom: 20px;
    }

    .feature-card {
      min-height: 175px;
    }

    .feature-icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      margin-bottom: 15px;
      border-radius: 13px;
      background: var(--brand-soft);
      color: var(--brand);
      font-size: 1.2rem;
    }

    .step-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .step-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: white;
    }

    .step-number {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      margin-bottom: 12px;
      border-radius: 9px;
      background: var(--brand);
      color: white;
      font-weight: 800;
    }

    /* ------------------------------------------------------------------
       Login, identity card, request flow and activity timeline
       ------------------------------------------------------------------ */
    .login-wrap {
      max-width: 490px;
      margin: 18px auto;
    }

    .role-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px;
      padding: 5px;
      border-radius: 13px;
      background: var(--surface-soft);
    }

    .role-switch button {
      border: 0;
      border-radius: 9px;
      padding: 10px;
      background: transparent;
      color: var(--muted);
      font-weight: 800;
    }

    .role-switch button.active {
      background: white;
      color: var(--brand);
      box-shadow: 0 2px 8px rgba(30, 50, 90, .08);
    }

    .identity-card {
      position: relative;
      overflow: hidden;
      width: min(390px, 100%);
      min-height: 225px;
      padding: 22px;
      border-radius: 20px;
      color: white;
      background: radial-gradient(circle at 100% 0%, rgba(111, 164, 255, .55), transparent 36%), linear-gradient(135deg, #101b35, #2448a8 72%, #315ee8);
      box-shadow: 0 18px 35px rgba(26, 58, 140, .2);
    }

    .identity-card.disabled {
      filter: grayscale(1);
      opacity: .7;
    }

    .card-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #dce6ff;
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .card-holder {
      margin-top: 26px;
      font: 700 1.15rem Manrope, sans-serif;
    }

    .card-number {
      margin-top: 7px;
      font: 700 1.35rem ui-monospace, monospace;
      letter-spacing: .1em;
    }

    .card-bottom {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin-top: 13px;
      color: #dce6ff;
      font-size: .78rem;
    }

    .qr-box {
      display: inline-block;
      margin-top: 15px;
      padding: 8px;
      border-radius: 9px;
      background: white;
    }

    .progress {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 13px 0 7px;
    }

    .progress span {
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 30px;
      color: #8994a8;
      font-size: .72rem;
      font-weight: 700;
    }

    .progress span.done {
      border-color: #cfe8db;
      background: #eef9f2;
      color: var(--green);
    }

    .share-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 14px 0;
    }

    .share-grid>div {
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-soft);
      font-size: .84rem;
    }

    .result-list {
      list-style: none;
      padding: 0;
      margin: 8px 0;
    }

    .result-list li {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
    }

    .result-list li:last-child {
      border-bottom: 0;
    }

    .answer {
      flex: 0 0 auto;
      font-weight: 800;
    }

    .answer.yes {
      color: var(--green);
    }

    .answer.no {
      color: var(--red);
    }

    .answer.unsure,
    .answer.revoked {
      color: #778196;
    }

    .log-item {
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
    }

    .log-item:last-child {
      border-bottom: 0;
    }

    .log-time {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: .76rem;
    }

    .notification-panel {
      position: fixed;
      z-index: 30;
      top: 78px;
      right: 20px;
      width: min(360px, calc(100vw - 40px));
      max-height: 65vh;
      overflow: auto;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: white;
      box-shadow: var(--shadow);
    }

    .notification-item {
      padding: 11px 8px;
      border-bottom: 1px solid var(--line);
      font-size: .88rem;
    }

    .notification-item:last-child {
      border-bottom: 0;
    }

    #toast {
      position: fixed;
      z-index: 50;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 16px);
      opacity: 0;
      pointer-events: none;
      max-width: min(560px, calc(100vw - 32px));
      padding: 12px 17px;
      border-radius: 12px;
      background: #15213d;
      color: white;
      box-shadow: var(--shadow);
      transition: .2s ease;
    }

    #toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    body.screen-blur .sensitive-result {
      filter: blur(9px);
      user-select: none;
    }

    .trust-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 9px;
      border: 1px solid rgba(200, 255, 69, .28);
      border-radius: 999px;
      background: rgba(200, 255, 69, .08);
      color: #c8ff45;
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .upload-panel {
      border: 1px dashed #526b58;
      border-radius: 14px;
      padding: 16px;
      background: rgba(200, 255, 69, .035)
    }

    .overask-warning {
      display: none;
      margin: 12px 0;
      padding: 13px 15px;
      border: 1px solid rgba(255, 190, 70, .45);
      border-radius: 12px;
      background: rgba(255, 190, 70, .09);
      color: #f4cf83
    }

    .overask-warning.visible {
      display: block
    }

    .fact-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      margin: 12px 0
    }

    .fact-grid .choice {
      margin: 0;
      min-height: 54px;
      display: flex;
      align-items: center
    }

    @media(max-width:600px) {
      .fact-grid {
        grid-template-columns: 1fr
      }
    }

    .pipeline {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin: 14px 0;
    }

    .pipeline-step {
      padding: 11px 9px;
      border: 1px solid #2a3944;
      border-radius: 11px;
      background: #0d151b;
    }

    .pipeline-step strong {
      display: block;
      color: #c8ff45;
      font-size: .78rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .pipeline-step small {
      display: block;
      margin-top: 5px;
      color: #9aa8b1;
      font-size: .72rem;
      line-height: 1.4;
    }

    .support-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 14px;
    }

    .support-form .wide {
      grid-column: 1/-1;
    }

    @media(max-width:680px) {
      .pipeline {
        grid-template-columns: 1fr 1fr
      }

      .support-form {
        grid-template-columns: 1fr
      }

      .support-form .wide {
        grid-column: auto
      }
    }

    @media print {
      body * {
        visibility: hidden !important;
      }

      #printableIdentityCard,
      #printableIdentityCard * {
        visibility: visible !important;
      }

      #printableIdentityCard {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 85mm;
        min-height: 54mm;
      }

      .no-print {
        display: none !important;
      }

      body {
        background: #fff !important;
      }
    }

    @media (max-width: 900px) {
      .site-header {
        flex-wrap: wrap;
        padding: 12px 18px;
      }

      .header-right {
        width: 100%;
        justify-content: space-between;
      }

      .nav {
        overflow-x: auto;
        flex-wrap: nowrap;
        max-width: calc(100vw - 150px);
      }

      .nav-button {
        white-space: nowrap;
      }
    }

    @media (max-width: 680px) {
      main {
        width: min(100% - 24px, 560px);
        padding-top: 20px;
      }

      .site-header {
        gap: 8px;
      }

      .header-right {
        align-items: flex-start;
      }

      .nav {
        max-width: calc(100vw - 110px);
      }

      .nav-button {
        padding: 8px;
        font-size: .78rem;
      }

      .grid,
      .grid.three,
      .step-list {
        grid-template-columns: 1fr;
      }

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script>
    'use strict';

    // =====================================================================
    // 1. App state and small utility functions
    // =====================================================================
    const $ = selector => document.querySelector(selector);
    // CARD ID BRANDING: PR- is the real backend ID; accept old CT- input for compatibility.
    // Update the server-side ID generator to PR- if you also want newly issued IDs stored as PR.
    const displayCardId = id => String(id ?? '').replace(/^CT-/i, 'PR-');
    const backendCardId = id => String(id ?? '').replace(/^CT-/i, 'PR-');
    const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[character]);
    const sleep = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
    const formatDate = timestamp => timestamp ? new Date(timestamp).toLocaleString() : '—';
    const state = {
      role: 'user',
      user: null,
      activePage: '',
      selectedRequestId: null,
      prefilledCardId: '',
      language: localStorage.getItem('pramaan-language') || 'en',
      lastRequestSignature: '',
      notifications: [],
      uploadedCredentials: []
    };

    const verifierTypes = ['College', 'Hostel', 'Employer', 'Hotel', 'Scholarship portal'];
    const navigationLabels = {
      en: { card: 'My card', wallet: 'Wallet', inbox: 'Requests', log: 'Activity', settings: 'Settings', check: 'New check', history: 'History', portal: 'Portal API', docs: 'Privacy', help: 'Help' },

    };
    const hindiText = {
      'Your identity card': 'आपका पहचान कार्ड', 'My Pramaan card': 'मेरा Pramaan कार्ड', 'Your card is a reference—not a container for your personal documents.': 'आपका कार्ड केवल एक संदर्भ है—इसमें आपके निजी दस्तावेज़ नहीं होते।', 'Apply for a card': 'कार्ड के लिए आवेदन करें', 'Choose the format. Issuance is simulated in this prototype.': 'कार्ड का प्रकार चुनें। इस प्रोटोटाइप में जारी करने की प्रक्रिया सिम्युलेटेड है।', 'Digital card': 'डिजिटल कार्ड', 'Physical card': 'फिजिकल कार्ड', 'Apply for card': 'कार्ड के लिए आवेदन करें', 'Disable lost card': 'खोया हुआ कार्ड बंद करें', 'Credential wallet': 'क्रेडेंशियल वॉलेट', 'Verification requests': 'सत्यापन अनुरोध', 'Nothing is shared until you approve selected questions.': 'आपके चुने हुए प्रश्नों की अनुमति से पहले कुछ भी साझा नहीं किया जाता।', 'Access activity': 'एक्सेस गतिविधि', 'Account preferences': 'खाता प्राथमिकताएँ', 'Settings': 'सेटिंग्स', 'Notifications': 'सूचनाएँ', 'In-app notifications': 'ऐप के अंदर सूचनाएँ', 'SMS alerts (simulated)': 'SMS अलर्ट (सिम्युलेटेड)', 'Email alerts (simulated)': 'ईमेल अलर्ट (सिम्युलेटेड)', 'Delete account': 'खाता हटाएँ', 'Delete my account': 'मेरा खाता हटाएँ', 'Start a verification': 'सत्यापन शुरू करें', 'Ask only the questions allowed for your organisation type.': 'केवल अपने संगठन के प्रकार के लिए अनुमत प्रश्न पूछें।', 'Card ID or registered phone number': 'कार्ड ID या पंजीकृत फोन नंबर', 'Scan / enter card ID': 'स्कैन करें / कार्ड ID दर्ज करें', 'Tap card (NFC)': 'कार्ड टैप करें (NFC)', 'Purpose of this check': 'इस जाँच का उद्देश्य', 'Allowed questions': 'अनुमत प्रश्न', 'Send request for approval': 'अनुमति के लिए अनुरोध भेजें', 'Check history': 'जाँच इतिहास', 'How the demo handles records': 'डेमो रिकॉर्ड को कैसे संभालता है', 'Help and frequently asked questions': 'सहायता और अक्सर पूछे जाने वाले प्रश्न', 'Log out': 'लॉग आउट', 'Use demo fingerprint': 'डेमो फिंगरप्रिंट इस्तेमाल करें', 'Person': 'व्यक्ति', 'Verifier': 'सत्यापनकर्ता', '10-digit phone number': '10 अंकों का फोन नंबर', 'Demo OTP': 'डेमो OTP', 'Log in / Create account': 'लॉग इन / खाता बनाएँ', 'Use your registered phone number and demo OTP to continue.': 'जारी रखने के लिए अपना पंजीकृत फोन नंबर और डेमो OTP इस्तेमाल करें।', 'Verifier workspace': 'सत्यापनकर्ता कार्यक्षेत्र', 'Organisation type': 'संगठन का प्रकार', 'Card ID or registered phone number': 'कार्ड ID या पंजीकृत फ़ोन नंबर', 'Purpose of this check': 'इस जाँच का उद्देश्य', 'Allowed questions': 'अनुमत प्रश्न', 'Send request for approval →': 'अनुमति के लिए अनुरोध भेजें →', 'Requests created': 'बनाए गए अनुरोध', 'Requested consent duration': 'अनुमति की अवधि', 'Select information required': 'आवश्यक जानकारी चुनें', 'Organization name': 'संगठन का नाम', 'Purpose of verification': 'सत्यापन का उद्देश्य', 'Full name': 'पूरा नाम', 'Date of birth': 'जन्म तिथि', 'Email address': 'ईमेल पता', 'Qualification': 'योग्यता', 'Graduation year': 'स्नातक वर्ष', 'Address': 'पता', 'Print digital card / Save as PDF': 'डिजिटल कार्ड प्रिंट करें / PDF के रूप में सहेजें', 'Upload a credential': 'क्रेडेंशियल अपलोड करें', 'Choose file': 'फ़ाइल चुनें', 'Add to my wallet': 'मेरे वॉलेट में जोड़ें', 'No checks yet': 'अभी तक कोई जाँच नहीं', 'Purpose:': 'उद्देश्य:', 'Latest request': 'नवीनतम अनुरोध', 'Start a verification': 'सत्यापन शुरू करें'
    };

    function translateCurrentPage() {
      if (state.language !== 'hi') return;
      const root = $('#app');
      if (!root) return;
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(node => {
        const original = node.nodeValue.trim();
        if (hindiText[original]) node.nodeValue = node.nodeValue.replace(original, hindiText[original]);
      });
      root.querySelectorAll('input[placeholder],textarea[placeholder]').forEach(el => {
        if (hindiText[el.placeholder]) el.placeholder = hindiText[el.placeholder];
      });
      root.querySelectorAll('button,option,select,label').forEach(el => {
        if (el.title && hindiText[el.title]) el.title = hindiText[el.title];
        if (el.getAttribute('aria-label') && hindiText[el.getAttribute('aria-label')]) el.setAttribute('aria-label', hindiText[el.getAttribute('aria-label')]);
      });
    }

    function showToast(message) {
      const toast = $('#toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 3200);
    }

    async function api(endpoint, method = 'GET', body) {
      const response = await fetch(`/api/${endpoint}`, {
        method,
        headers: {
          'Content-Type': 'application/json',
          Authorization: `Bearer ${localStorage.getItem('pramaan-token') || ''}`
        },
        body: body === undefined ? undefined : JSON.stringify(body)
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        if (response.status === 401 && endpoint !== 'login') {
          localStorage.removeItem('pramaan-token');
          state.user = null;
          renderLogin();
        }
        throw new Error(data.error || 'Something went wrong. Please try again.');
      }
      return data;
    }

    function safelyRun(action) {
      return async (...args) => {
        try { await action(...args); }
        catch (error) { showToast(error.message); }
      };
    }

    // =====================================================================
    // 2. Navigation, language preview and session boot
    // =====================================================================
    function renderNavigation() {
      const nav = $('#navigation');
      const labels = navigationLabels[state.language];
      const pages = !state.user ? [] : state.user.role === 'user'
        ? ['card', 'wallet', 'inbox', 'log', 'settings', 'docs', 'help']
        : ['check', 'history', 'portal', 'settings', 'docs', 'help'];

      nav.innerHTML = state.user
        ? pages.map(page => `<button class="nav-button ${state.activePage === page ? 'active' : ''}" onclick="goTo('${page}')">${labels[page]}</button>`).join('')
        : `<button class="nav-button" onclick="home()">Home</button><button class="nav-button" onclick="scrollToSection('how-it-works')">How it works</button><button class="nav-button" onclick="scrollToSection('privacy')">Privacy</button><button class="nav-button active" onclick="renderLogin()">Log in</button>`;

      $('#languageButton').textContent = state.language === 'en' ? 'हिंदी' : 'English';
      $('#logoutButton').classList.toggle('hidden', !state.user);
      $('#notificationButton').classList.toggle('hidden', !state.user);
    }

    function toggleLanguage() {
      state.language = state.language === 'en' ? 'hi' : 'en';
      localStorage.setItem('pramaan-language', state.language);
      if (state.user && state.activePage) goTo(state.activePage);
      else renderLanding();
      renderNavigation();
      showToast(state.language === 'hi' ? 'हिंदी भाषा सक्रिय है। कुछ तकनीकी शब्द अंग्रेज़ी में रह सकते हैं।' : 'English language selected.');
    }

    async function boot() {
      const hashMatch = location.hash.match(/verify-((?:PR|CT)-[A-Z0-9]+)/i);
      if (hashMatch) state.prefilledCardId = displayCardId(hashMatch[1].toUpperCase());
      const token = localStorage.getItem('pramaan-token');
      if (!token) return renderLanding();

      try {
        state.user = await api('me');
        renderNavigation();
        await goTo(state.user.role === 'user' ? 'card' : 'check');
        await refreshNotifications();
      } catch {
        localStorage.removeItem('pramaan-token');
        state.user = null;
        renderLanding();
      }
    }

    async function goTo(page, isPolling = false) {
      if (!isPolling) {
        state.activePage = page;
        state.lastRequestSignature = '';
        renderNavigation();
      }
      const views = {
        card: renderCard,
        wallet: renderWallet,
        inbox: renderInbox,
        log: renderActivity,
        settings: renderSettings,
        check: renderVerifierCheck,
        history: renderVerifierHistory,
        portal: renderPortalApi,
        docs: renderPrivacyPage,
        help: renderHelpPage
      };
      if (!views[page]) return;
      try { await views[page](isPolling); translateCurrentPage(); }
      catch (error) { if (!isPolling) showToast(error.message); }
    }

    function home() {
      if (state.user) return goTo(state.user.role === 'user' ? 'card' : 'check');
      renderLanding();
    }

    function scrollToSection(id) {
      if (!document.getElementById(id)) renderLanding();
      document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

        <section class="section" id="how-it-works">
          <div class="section-intro"><div class="eyebrow">[ 01 — The protocol ]</div><h2>One request.<br>Six deliberate steps.</h2><p class="muted">The card helps start a request. Your approval—not the card—is what allows a check to proceed.</p></div>
          <div class="step-list">
            <article class="step-card"><div class="step-number">01</div><h3>Get your card</h3><p class="muted">Apply for a digital or physical card. It contains a reference ID, not your documents.</p></article>
            <article class="step-card"><div class="step-number">02</div><h3>A verifier asks</h3><p class="muted">An organisation chooses from a limited set of questions and explains why it needs an answer.</p></article>
            <article class="step-card"><div class="step-number">03</div><h3>You decide</h3><p class="muted">Review every question. Approve selected ones, deny the request or block the verifier.</p></article>
            <article class="step-card"><div class="step-number">04</div><h3>A source is checked</h3><p class="muted">In this prototype, mock agency records are checked in server memory to produce a demo answer.</p></article>
            <article class="step-card"><div class="step-number">05</div><h3>Only facts get through</h3><p class="muted">The verifier sees Yes, No, Could not determine or Revoked—not a copy of your document.</p></article>
            <article class="step-card"><div class="step-number">06</div><h3>You stay in control</h3><p class="muted">Review access history, set an expiry, revoke active access or disable a lost card.</p></article>
          </div>
        </section>

        <section class="section" id="experiences">
          <div class="section-intro"><div class="eyebrow">[ 02 — Two sides. One standard. ]</div><h2>Built for the<br>person and the proof.</h2><p class="muted">A simple experience for people. A structured workflow for organisations.</p></div>
          <div class="grid">
            <article class="card feature-card"><div class="feature-icon">◈</div><div class="eyebrow">For people</div><h3>Your identity dashboard</h3><p class="muted">A credential wallet, request inbox, per-question consent, access history and card controls.</p><button class="button primary" onclick="startLogin('user')">Open personal demo ↗</button></article>
            <article class="card feature-card"><div class="feature-icon">⌁</div><div class="eyebrow">For organisations</div><h3>Verification workspace</h3><p class="muted">Organisation-specific questions, request tracking, instant demo results and a sample API.</p><button class="button primary" onclick="startLogin('verifier')">Open verifier demo ↗</button></article>
          </div>
        </section>

        <section class="section" id="privacy">
          <div class="section-intro"><div class="eyebrow">[ 03 — Privacy is the product ]</div><h2>Less data shared.<br>More control kept.</h2></div>
          <div class="grid three">
            <article class="card"><div class="feature-icon">✓</div><h3>Consent first</h3><p class="muted">No question is answered until you approve it in your account.</p></article>
            <article class="card"><div class="feature-icon">◉</div><h3>Minimum disclosure</h3><p class="muted">A verifier receives a result for each approved question, not a document upload.</p></article>
            <article class="card"><div class="feature-icon">↗</div><h3>Visible access</h3><p class="muted">Requests and outcomes appear in your activity history so you can review them.</p></article>
          </div>
          <div class="notice">Prototype note: the app uses fake agency records and rule-based checks. It does not connect to government systems, a real AI model, a blockchain, SMS provider or biometric service.</div>
        </section>
        <section class="section card soft" style="text-align:center;padding:clamp(28px,6vw,64px)">
          <div class="eyebrow">[ 04 — Try the experience ]</div><h2>Ready to take<br>back control?</h2><p class="muted" style="margin:8px auto 18px">Use the demo OTP <strong>123456</strong>. The sample person account already has a mock credential profile.</p>
          <button class="button primary large" onclick="startLogin('user')">Continue as a person ↗</button>
          <button class="button large" onclick="startLogin('verifier')">Continue as a verifier</button>
        </section>`;
      // Reveal sections as they enter the viewport. Content remains visible if motion is reduced.
      $('#app').querySelectorAll('.section, .ticker').forEach(element => element.classList.add('reveal'));
      if ('IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        const observer = new IntersectionObserver(entries => entries.forEach(entry => {
          if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); }
        }), { threshold: 0.08 });
        $('#app').querySelectorAll('.reveal').forEach(element => observer.observe(element));
      } else {
        $('#app').querySelectorAll('.reveal').forEach(element => element.classList.add('visible'));
      }

      translateCurrentPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });

    // =====================================================================
    // 4. Login and registration
    // =====================================================================
    function startLogin(role) {
      renderLogin();
      chooseRole(role);
    }

    function renderLogin() {
      state.user = null;
      state.activePage = '';
      renderNavigation();
      $('#app').innerHTML = `
        <div class="login-wrap">
          <div class="card">
            <div class="eyebrow">Welcome to Pramaan</div>
            <h2 style="font-size:1.8rem;margin-top:8px">Sign in to continue</h2>
            <p class="muted">Demo sign-in uses a fixed OTP. Real OTP delivery and device passkeys need a production identity provider.</p>
            <div class="role-switch" style="margin:20px 0">
              <button id="personRole" class="active" onclick="chooseRole('user')">Person</button>
              <button id="verifierRole" onclick="chooseRole('verifier')">Verifier</button>
            </div>
            <form id="loginForm" onsubmit="event.preventDefault(); login();">
              <div id="personLoginMode" class="field"><span>Sign in using</span><div class="role-switch"><button type="button" id="loginByPhone" class="active" onclick="setUserLoginMode('phone')">Phone number</button><button type="button" id="loginByCard" onclick="setUserLoginMode('card')">Card ID</button></div></div>
              <label class="field" id="loginIdentifierLabel">Registered phone number<input id="identifierInput" type="tel" inputmode="numeric" maxlength="10" placeholder="e.g. 9876543210" required></label>
              <div id="registrationFields"></div>
              <label class="field">Demo OTP<input id="otpInput" type="text" inputmode="numeric" maxlength="6" placeholder="123456" required></label>
              <button class="button primary" type="submit" style="width:100%;margin:8px 0">Log in / Create account</button>
            </form>
            <button class="button" style="width:100%;margin:4px 0" onclick="simulateBiometricLogin()">Use demo fingerprint</button>
            <div class="notice blue">Demo OTP: <strong>123456</strong>. Fingerprint is a demo shortcut, not biometric authentication. Real OTP / passkey verification is not connected.</div>
            <div class="divider"></div>
            <small>Sample accounts<br>Person: 9876543210 · TechNova HR: 9000000001 · Sample University: 9000000002</small>
            <p style="margin-bottom:0"><a href="#" onclick="home();return false">← Back to home</a></p>
          </div>
        </div>`;
      state.userLoginMode = 'phone';
      chooseRole('user');
      translateCurrentPage();
    }

    function chooseRole(role) {
      state.role = role;
      $('#personRole')?.classList.toggle('active', role === 'user');
      $('#verifierRole')?.classList.toggle('active', role === 'verifier');
      $('#personLoginMode').classList.toggle('hidden', role !== 'user');
      $('#loginIdentifierLabel').innerHTML = role === 'user'
        ? (state.userLoginMode === 'card' ? 'Pramaan card ID<input id="identifierInput" type="text" maxlength="16" placeholder="PR-ABC123" required>' : 'Registered phone number<input id="identifierInput" type="tel" inputmode="numeric" maxlength="10" placeholder="e.g. 9876543210" required>')
        : 'Phone number or email address<input id="identifierInput" type="text" autocomplete="username" placeholder="10-digit phone or name@example.com" required>';
      $('#loginByPhone')?.classList.toggle('active', state.userLoginMode !== 'card');
      $('#loginByCard')?.classList.toggle('active', state.userLoginMode === 'card');
      $('#registrationFields').innerHTML = role === 'user'
        ? '<label class="field">Your name <span class="muted">(new accounts only)</span><input id="nameInput" maxlength="40" placeholder="Your full name"></label>'
        : `<label class="field">Organisation name <input id="nameInput" maxlength="60" placeholder="Required for new registration"></label>
           <label class="field">Organisation type <select id="typeInput">${verifierTypes.map(type => `<option value="${escapeHtml(type)}">${escapeHtml(type)}</option>`).join('')}</select></label>
           <label class="field">Registered phone number <input id="verifierPhoneInput" type="tel" inputmode="numeric" maxlength="10" placeholder="Required only for new accounts"></label>
           <small>Existing verifier accounts can sign in using their registered phone number or email. New accounts also need a registered phone number for OTP delivery.</small>`;
    }

    function setUserLoginMode(mode) {
      state.userLoginMode = mode;
      chooseRole('user');
    }

    const login = safelyRun(async () => {
      const role = state.role;
      const loginIdentifier = $('#identifierInput').value.trim();
      const response = await api('login', 'POST', {
        role,
        identifier: role === 'user' && state.userLoginMode === 'card' ? backendCardId(loginIdentifier) : loginIdentifier,
        identifierType: role === 'user' ? state.userLoginMode : 'account',
        phone: role === 'verifier' ? ((/^\d{10}$/.test(loginIdentifier) ? loginIdentifier : '') || ($('#verifierPhoneInput')?.value.trim() || '')) : '',
        email: role === 'verifier' && loginIdentifier.includes('@') ? loginIdentifier : '',
        otp: $('#otpInput').value.trim(),
        name: $('#nameInput')?.value.trim() || '',
        type: $('#typeInput')?.value
      });
      localStorage.setItem('pramaan-token', response.token);
      state.user = await api('me');
      renderNavigation();
      showToast('You are logged in.');
      await goTo(role === 'user' ? 'card' : 'check');
      await refreshNotifications();
    });

    function simulateBiometricLogin() {
      const otp = $('#otpInput');
      if (otp) otp.value = '123456';
      login();
    }

    const logout = safelyRun(async () => {
      await api('logout', 'POST');
      localStorage.removeItem('pramaan-token');
      state.user = null;
      renderLanding();
    });

    // =====================================================================
    // 5. Person experience: card, wallet, request inbox and access history
    // =====================================================================
    async function renderCard() {
      const person = await api('me');
      state.user = person;
      const card = person.card;
      $('#app').innerHTML = `
        <div class="page-heading"><div class="eyebrow">Your identity card</div><h2>My Pramaan card</h2><p>Your card is a reference—not a container for your personal documents.</p></div>

          ${card ? `

              <div class="card-holder">${escapeHtml(person.name)}</div>
              <div class="card-number">${escapeHtml(displayCardId(card.id))}</div>
              <div class="card-bottom"><span>${escapeHtml(card.type)} card</span><span>${escapeHtml(card.status.toUpperCase())}</span></div>
              <div id="qrCode" class="qr-box"></div>

            ${card.type === 'Digital' ? '<button class="button primary no-print" onclick="printDigitalCard()">Print digital card / Save as PDF</button>' : ''}

        </section>
        <section class="card soft"><h3>What happens when someone scans it?</h3><p class="muted">The verifier can identify which account to request a check from. Your phone approval is still required. A QR code is not a login token or an approval.</p></section>`;

      if (card && window.QRCode) {

    function requestStatusLabel(status) {
      const labels = { sent: 'Waiting for your decision', answered: 'Answered', denied: 'Denied', expired: 'Expired', revoked: 'Access revoked' };
      return labels[status] || status;
    }

    function requestProgress(request) {
      const completed = ['answered', 'expired', 'revoked'].includes(request.status);
      const steps = ['Request sent', 'Your consent', 'Source check', 'Result'];
      const activeIndex = completed ? 4 : 1;
      return `<div class="progress">${steps.map((step, index) => `<span class="${index < activeIndex ? 'done' : ''}">${step}</span>`).join('')}</div>
        <small>${completed ? 'Demo check complete. No real document file was fetched or deleted.' : request.status === 'denied' ? 'You denied this request.' : 'Waiting for you to review the request.'}</small>`;
    }

    function answerMarkup(answer) {
      const labels = {
        yes: ['✓ Yes', 'yes'], no: ['✕ No', 'no'], unsure: ['Could not determine', 'unsure'], revoked: ['Source revoked', 'revoked']
      };
      const [label, style] = labels[answer] || ['Not available', 'unsure'];
      return `<span class="answer ${style} sensitive-result">${label}</span>`;
    }

    function requestResults(request) {
      if (request.status === 'sent' || request.status === 'denied') return '';
      return `<ul class="result-list">${request.questions.map(question => {
        let result = question.answer ? answerMarkup(question.answer)
          : `<span class="answer unsure">${question.approved ? (request.status === 'revoked' ? 'Access revoked' : 'Expired') : 'Not shared'}</span>`;
        return `<li><span>${escapeHtml(question.text)}</span>${result}</li>`;
      }).join('')}</ul>`;
    }

      if (request.status === 'sent') {
        if (request.overAsk || request.questions.length >= 3) content += `<div class="notice amber" role="alert"><strong>⚠ Over-ask warning</strong><br>This verifier requested ${request.questions.length} details. This may be more information than necessary for the stated purpose. Review each question carefully; you can approve only selected items or deny the request.</div>`;

    async function scanCard() {
      if (!('BarcodeDetector' in window) || !navigator.mediaDevices?.getUserMedia) {
        const entered = prompt('Camera QR scanning is unavailable in this browser. Enter the card ID shown on the person’s Pramaan card.');
        if (entered) $('#personIdentifier').value = entered.trim().toUpperCase();
        return;
      }
      let stream;
      try {
        const detector = new BarcodeDetector({ formats: ['qr_code'] });
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const panel = document.createElement('section');
        panel.className = 'card';
        panel.innerHTML = '<div class="card-head"><h3>Scan Pramaan QR</h3><button class="button small" type="button" id="closeQrScan">Close</button></div><video id="qrCamera" autoplay playsinline style="width:100%;max-height:360px;object-fit:cover;border-radius:12px;background:#080d11"></video><p class="muted">Point the camera at the QR code on the Pramaan card.</p>';
        $('#app').prepend(panel);
        const video = $('#qrCamera');
        video.srcObject = stream;
        $('#closeQrScan').onclick = () => { stream.getTracks().forEach(track => track.stop()); panel.remove(); };
        const scanLoop = async () => {
          if (!document.body.contains(video)) return;
          try {
            const codes = await detector.detect(video);
            if (codes.length) {
              const match = String(codes[0].rawValue || '').match(/(?:PR|CT)-[A-Z0-9]+/i);
              if (match) {
                $('#personIdentifier').value = displayCardId(match[0].toUpperCase());
                stream.getTracks().forEach(track => track.stop());
                panel.remove();
                showToast('Card ID scanned. The person must still approve your request.');
                return;
              }
            }
          } catch { /* Keep the camera preview active while the detector waits. */ }
          requestAnimationFrame(scanLoop);
        };
        video.onloadedmetadata = () => scanLoop();
      } catch (error) {
        if (stream) stream.getTracks().forEach(track => track.stop());
        showToast(`Camera scan unavailable: ${error.message}. You can enter the card ID manually.`);
      }
    }

    async function readNfcCard() {
      if (!('NDEFReader' in window)) return scanCard();
      try {
        const reader = new NDEFReader();
        await reader.scan();
        showToast('Hold the NFC card near your device.');
        reader.onreading = event => {
          for (const record of event.message.records) {
            const text = new TextDecoder().decode(record.data);
            const match = text.match(/(?:PR|CT)-[A-Z0-9]+/i);
            if (match) $('#personIdentifier').value = displayCardId(match[0].toUpperCase());
          }
        };
      } catch {
        showToast('NFC is unavailable here. Use manual card ID entry instead.');
      }
    }

        </section>`;
    }

    function copyApiKey(key) {
      if (!navigator.clipboard) return showToast('Clipboard access is unavailable. Select and copy the key manually.');
      navigator.clipboard.writeText(key)
        .then(() => showToast('API key copied.'))
        .catch(() => showToast('Copy is unavailable in this browser.'));
    }

    // =====================================================================
    // 7. Shared privacy explanation and help pages
    // =====================================================================
    async function renderPrivacyPage() {
      $('#app').innerHTML = `
        <div class="page-heading"><div class="eyebrow">Plain-language explanation</div><h2>How the demo handles records</h2><p>What the prototype does today—and what a real implementation would still need.</p></div>
        <section class="card">
          <div class="eyebrow">The five-stage document lifecycle</div><h3>Fetch → Read → Locate → Answer → Delete</h3>
          <div class="pipeline">
            <div class="pipeline-step"><strong>Fetch</strong><small>In a real deployment, fetch only the required source document over an authenticated agency channel. Demo: mock record lookup.</small></div>
            <div class="pipeline-step"><strong>Read</strong><small>OCR or a vision model would read the soft copy. Demo: reads structured mock fields; no OCR/AI is connected.</small></div>
            <div class="pipeline-step"><strong>Locate</strong><small>Find only the field needed for the approved question. Demo: a fixed rule selects the relevant field.</small></div>
            <div class="pipeline-step"><strong>Answer</strong><small>Return Yes, No or Could not determine. Demo: rule-based result, including source-unavailable states.</small></div>
            <div class="pipeline-step"><strong>Delete</strong><small>A real service must discard the fetched file and extracted text. Demo: no document file exists to delete.</small></div>
          </div>
          <div class="row"><strong>Consent</strong><span class="pill green">Implemented in demo</span></div><p class="muted">The person approves or denies each selected question before a result is generated.</p>
          <div class="row"><strong>Agency connection and AI reading</strong><span class="pill amber">Simulated / not connected</span></div><p class="muted">The prototype reads mock records held in server memory. It does not fetch government documents or run OCR / a vision model.</p>
          <div class="row"><strong>Audit history</strong><span class="pill green">Implemented in demo</span></div><p class="muted">The database stores request metadata, approved questions, answer outcomes and timestamps—not document contents. No blockchain connection is active.</p>
        </section>
        <section class="card"><h3>Important security limitations</h3><ul class="muted"><li>This is not a production identity system and has not undergone a security audit.</li><li>OTP and fingerprint are demo-only. NFC can read compatible NDEF text tags on supported devices, but it does not authenticate a tag or prevent cloning. AI, blockchain, government integrations and external SMS/email delivery are not live.</li><li>The browser blur and print deterrent are only privacy aids. They cannot reliably prevent screenshots, screen recording or external-camera capture.</li><li>Do not enter real identity numbers, documents or other sensitive personal information.</li></ul></section>`;
    }

    async function renderHelpPage() {
      const questions = [
        ['What is the demo OTP?', 'Use 123456. No real SMS is sent.'],
        ['What does the fingerprint button do?', 'It fills the demo OTP and uses the same login check. It is not biometric authentication.'],
        ['Can a verifier see my document?', 'The demo verifier receives only the answer for each question you approve. The prototype uses mock source records, not real documents.'],
        ['Why can the result say “Could not determine”?', 'A mock source record may be marked unreadable. The demo avoids guessing and returns an uncertain result.'],
        ['Can I stop access early?', 'Yes. Open Requests and choose Revoke access now while an answer is active.'],
        ['Does scanning the QR or tapping NFC approve a request?', 'No. It only reads a card reference. The verifier must still send a request and you must approve it. NFC tag authenticity is not cryptographically checked in this demo.'],
        ['Is this connected to government agencies?', 'No. The source records are simulated locally in the server process.']
      ];
      $('#app').innerHTML = `<div class="page-heading"><div class="eyebrow">Support centre</div><h2>Help and frequently asked questions</h2><p>Quick answers about this Pramaan prototype.</p></div>
        <section class="card">${questions.map(([question, answer]) => `<details class="row"><summary class="row-title">${escapeHtml(question)}</summary><p class="muted">${escapeHtml(answer)}</p></details>`).join('')}
          <div class="divider"></div><h3>Contact Pramaan support</h3><p class="muted">Send a demo support request. It is saved locally in this prototype; no email is sent.</p>
          <form class="support-form" onsubmit="event.preventDefault(); submitSupport();">
            <label class="field">Subject<input id="supportSubject" maxlength="100" required placeholder="What do you need help with?"></label>
            <label class="field">Category<select id="supportCategory"><option>Account access</option><option>Card or NFC</option><option>Verification request</option><option>Privacy concern</option><option>Other</option></select></label>
            <label class="field wide">Message<textarea id="supportMessage" rows="4" maxlength="2000" required placeholder="Describe the issue. Do not include passwords, OTPs or identity documents."></textarea></label>
            <div class="wide"><button class="button primary" type="submit">Submit support request</button></div>
          </form></section>`;
    }

    const submitSupport = safelyRun(async () => {
      const subject = `[${$('#supportCategory').value}] ${$('#supportSubject').value.trim()}`;
      const result = await api('support', 'POST', { subject, message: $('#supportMessage').value.trim() });
      $('#supportSubject').value = '';
      $('#supportMessage').value = '';
      showToast(`Support request received: ${result.ticketId}`);
    });

    // =====================================================================
    // 8. Notifications, privacy blur and background refresh
    // =====================================================================
    async function refreshNotifications() {
      if (!state.user) return;
      try {
        state.notifications = await api('notifications');
        const unseen = state.notifications.filter(item => item.time > Number(localStorage.getItem('pramaan-seen') || 0)).length;
        $('#notificationCount').textContent = unseen > 9 ? '9+' : String(unseen);
        $('#notificationCount').classList.toggle('hidden', unseen === 0);
      } catch { /* A notification refresh should never interrupt the current page. */ }
    }

    function toggleNotifications() {
      const panel = $('#notificationPanel');
      panel.classList.toggle('hidden');
      if (panel.classList.contains('hidden')) return;
      panel.innerHTML = `<h3 style="padding:4px 8px">Notifications</h3>${state.notifications.length
        ? state.notifications.slice(0, 12).map(item => `<div class="notification-item">${escapeHtml(item.message)}<br><small>${formatDate(item.time)}</small></div>`).join('')
        : '<div class="empty-state">No notifications yet.</div>'}`;
      localStorage.setItem('pramaan-seen', String(Date.now()));
      $('#notificationCount').classList.add('hidden');
    }

    function updatePrivacyBlur() {
      document.body.classList.toggle('screen-blur', document.hidden || !document.hasFocus());
    }
    window.addEventListener('blur', updatePrivacyBlur);
    window.addEventListener('focus', updatePrivacyBlur);
    document.addEventListener('visibilitychange', updatePrivacyBlur);

    setInterval(async () => {
      if (!state.user) return;
      await refreshNotifications();
      if (state.activePage === 'inbox') await goTo('inbox', true);
      if (state.activePage === 'history') await goTo('history', true);
      if (state.activePage === 'check') await refreshLatestVerifierRequest().catch(() => { });
    }, 5000);

    // Start the app.
    boot();
  </script>
</body>

</html>
